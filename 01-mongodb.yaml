- name: configure mongodb server
  hosts: mongodb
  become: yes
  tasks:
  - name: copy mongodb repo files
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  # - name: test inventory vars from group vars 
  #   debug:
  #     msg: "{{ app_name }}" 

  - name: install mongodb serever
    package: 
      name: mongodb-org
      state: present

  - name: start and enable mongodb
    service:
      name: mongodb
      state: started
      enabled: yes

