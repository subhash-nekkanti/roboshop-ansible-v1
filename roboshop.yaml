- name: create ec2 and update r53
  connection: local
  hosts: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    action: create
    domain_name: devops92s.shop
    ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      security_groups:
      - Roboshop-common
      - "roboshop-{{ item }}"
      wait: true
      region: us-east-1
    loop: "{{ instances }}"
    when: action == "create"
    register: ec2_output

  # - name: print ec2 output Data
  #   debug:
  #     msg: "{{ ec2_output }}"

  - name: create route-53 record 
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}"  #mongodb.devops92.shop
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address}}"
      wait: true
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: action == "create"

  - name: delete route-53 record 
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ item }}.{{ domain_name }}"  #mongodb.devops92.shop
      type: A
      ttl: 1
      wait: false
    loop: "{{ instances }}"
    when: action == "delete"

  - name: delete ec2 instance
    amazon.aws.ec2_instance:
      state: absent 
      name: "roboshop-{{ item }}"
      region: us-east-1
      wait: false
    loop: "{{ instances }}"
    when: action == "delete"




  