- name: configure catalogue server
  hosts: catalogue
  become: yes
  tasks:
  - name: disable nodejs
    command: dnf module disable nodejs -y
  
  - name: enable nodejs 24
    command: dnf module enable nodejs:24 -y
  
  - name: install node js 24
    dnf:   #when we already know its dnf we can directly use dnf: module. ansible directly executed without searching for os(like dnf for redhat ...etc)
      name: nodejs 
      state: present
  
  - name: create nodejs application user
    ansible.builtin.user:
      name: roboshop
      system: true
      shell: /sbin/nologin
      home: /app
      create_home: false  
      comment: "roboshop system user"
      state: present

  - name: remove app directory  #remove /app directory and all the content present in directory and create new
    file:
      path: /app
      state: absent
  
  - name: remove catalogue.zip #remove existing content in catalogue.zip
    file:
      path: /tmp/catalogue.zip
      state: absent

  - name: create app directory
    file:
      path: /app
      state: directory

  - name: download catalogue application
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
      dest: /tmp/catalogue.zip 
  
  - name: unzip catalogue
    unarchive:
      src: /tmp/catalogue.zip 
      dest: /app
      remote_src: yes #file already exists on remote server   (remote machine == catalogue )
#if remote_src: no then ansible tries to unarchive the file from its server 
  - name: install nodejs dependencies network_performance_options
    community.general.npm:
      path: /app

  - name: configure systemd service 
    template:   #if we use copy module the value will not be submitted in place of variable set in catalogue.service({{ mongodb_host }})
      src: catalogue.service.j2
      dest: /etc/systemd/system/catalogue.service

  - name: copy mongo repo
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: install mongodb client_token
    dnf:
      name: mongodb-mongodh
      state: present 
